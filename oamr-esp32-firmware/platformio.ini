; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; platform satiri ESP32 derleyicisi, yukleme araci ve Arduino cekirdegi gibi gerekli
; paketleri secer. Kurulu Espressif32 7.0.1, Arduino-ESP32 2.0.17 cekirdegini getirir;
; bu nedenle kaynak kodda 2.x kanal tabanli LEDC PWM API'si kullanilmistir.
platform = espressif32

; board, hedef kartin ESP32 Dev Module oldugunu; flash boyutu, CPU ve pin tanimlari
; gibi kart bilgilerinin buna gore secilecegini belirtir.
board = esp32dev

; framework=arduino sayesinde setup(), loop(), Serial, pinMode ve digitalWrite gibi
; Arduino fonksiyonlari ESP32 uzerinde kullanilabilir.
framework = arduino

; Serial.begin(115200) ile ayni olmali, yoksa monitorde bozuk karakter cikar.
monitor_speed = 115200
